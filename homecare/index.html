<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="AAA Homecare branch operations prototype">
<title>AAA Homecare | Operations</title>
<style>
:root{color-scheme:light;--navy:#142b2b;--green:#145f4a;--muted:#536562;--line:#dce7e2;--canvas:#f4f8f5;--white:#fff;--mint:#dff1e7;--amber:#fff0d6;--ink:#152e2a;font:15px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--canvas)}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button,input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:.55rem .75rem;background:white;color:var(--ink)}button:hover{border-color:var(--green)}:focus-visible{outline:3px solid #3b9376;outline-offset:2px}button.primary{background:var(--green);color:white;border-color:var(--green);font-weight:650}button.danger{color:#a13629}button.small{padding:.3rem .65rem;font-size:.84rem}input,select,textarea{width:100%}textarea{min-height:5rem;resize:vertical}
.shell{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.sidebar{padding:24px 16px;background:var(--navy);color:#fff;display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-size:1.08rem;font-weight:750}.mark{display:grid;place-items:center;width:37px;height:37px;border-radius:11px;background:#bde6d1;color:#133e32}.sidebar small,.sidebar label{color:#c3d5d0}.sidebar label{display:grid;gap:6px;font-size:.84rem}.sidebar select{background:#223f3d;color:white;border-color:#53716c}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#e1eeea;text-align:left}.nav button[aria-current=page]{background:#345751;color:white;font-weight:700}.nav button:hover{background:#345751}.sidefoot{margin-top:auto;border-top:1px solid #49615f;padding-top:15px}.sidefoot small{display:block;margin-bottom:9px}.sidefoot button{background:transparent;border-color:#829992;color:white}
main{min-width:0}.topbar{background:white;border-bottom:1px solid var(--line);padding:15px clamp(16px,4vw,46px);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.topbar label{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}.topbar select{width:auto;max-width:100%}.env{font-weight:700;font-size:.82rem;color:var(--green)}.content{max-width:1350px;margin:auto;padding:26px clamp(16px,4vw,46px) 48px}.hero{background:#e4f2e9;border:1px solid #d2e8d9;border-radius:18px;padding:26px;margin-bottom:18px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:750;color:var(--green)}h1,h2,p{margin:0}h1{font-size:clamp(1.6rem,4vw,2.5rem);line-height:1.12;letter-spacing:-.04em;margin:.3rem 0 .45rem}h2{font-size:1.13rem;line-height:1.25}p.sub,.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px}.card{padding:15px}.metric{font-size:1.8rem;font-weight:750;line-height:1.2;margin:.25rem 0}.panel{margin-bottom:15px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 17px;border-bottom:1px solid var(--line)}.panel-head p{font-size:.85rem;margin-top:3px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:10px 15px;border-bottom:1px solid #eaf0ec;vertical-align:middle}th{background:#f9fbf9;color:var(--muted);font-size:.78rem;white-space:nowrap}td{font-size:.9rem}tr:last-child td{border-bottom:0}.empty{padding:18px;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-block;border-radius:100px;padding:.19rem .55rem;background:#edf2f1;color:#34524e;font-size:.75rem;font-weight:700;white-space:nowrap}.badge.ok{background:var(--mint);color:#14513d}.badge.warn{background:var(--amber);color:#724d11}.badge.bad{background:#fbe8e3;color:#8b3528}.notice{margin-bottom:12px;color:var(--green);font-weight:650}.notice:empty{display:none}.notice.error{color:#a13629}.activity{list-style:none;padding:0;margin:0}.activity li{padding:10px 17px;border-bottom:1px solid #eaf0ec}.activity li:last-child{border:0}.activity time{display:block;font-size:.78rem;color:var(--muted)}.form-fields{display:grid;gap:12px;margin:14px 0}.form-fields label{display:grid;gap:4px;font-size:.88rem;font-weight:650}.form-fields label.check{display:flex;align-items:center;gap:7px}.check input{width:auto}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}dialog{width:min(490px,calc(100% - 24px));max-height:calc(100% - 24px);border:1px solid var(--line);border-radius:15px;padding:21px;color:var(--ink);box-shadow:0 18px 50px #0003}dialog::backdrop{background:#102b2b88}.dialog-error{color:#a13629;margin-bottom:8px}.dialog-error:empty{display:none}.register-filters{padding:12px 17px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.register-filters label{font-size:.85rem;font-weight:650}.register-filters select{width:auto;max-width:100%}.register-filters label select{display:block}.register-filters button{align-self:end}.register-pages{border-top:1px solid var(--line);padding:12px 17px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.notes{max-width:24rem;overflow-wrap:anywhere;white-space:pre-wrap}
@media(max-width:850px){.shell{grid-template-columns:180px minmax(0,1fr)}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.shell{display:block}.sidebar{padding:12px;gap:10px}.nav{display:flex;flex-wrap:wrap}.nav button{padding:.35rem .55rem;font-size:.84rem}.sidefoot{display:flex;align-items:center;justify-content:space-between;padding-top:6px;gap:8px}.sidefoot small{margin:0}.topbar{padding:10px 12px}.topbar label{flex-wrap:wrap}.content{padding:15px 12px 35px}.hero{padding:17px}.card{padding:11px}th,td{padding:8px 10px}}
.assessment-body{padding:16px 17px}.assessment-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}.assessment-card{min-width:0;border:1px solid var(--line);border-radius:12px;padding:13px;display:grid;gap:7px;overflow-wrap:anywhere}.diary-card{grid-column:1/-1}.diary-meta{color:var(--muted);font-size:.85rem}.diary-note{white-space:pre-wrap;overflow-wrap:anywhere;margin:.35rem 0}.assessment-card .actions a{padding:.35rem .65rem;border:1px solid var(--line);border-radius:8px;color:var(--green);text-decoration:none;font-size:.88rem}.assessment-body .form-fields{max-width:760px}.assessment-question{min-width:0;display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:9px}.assessment-question .actions{justify-content:flex-end}.assessment-body textarea{min-height:7rem}.assessment-error{color:#a13629}.assessment-body input[type=checkbox]{width:auto}.assessment-body [hidden]{display:none!important}
@media(max-width:620px){.assessment-body{padding:13px 12px}.assessment-body input,.assessment-body textarea,.assessment-body select{font-size:16px}.assessment-card .actions a,.assessment-body button{min-height:42px;display:inline-flex;align-items:center}}
.calendar-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.calendar-tools select,.calendar-tools input{width:auto;max-width:100%}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.calendar-grid button{text-align:left;min-height:58px;min-width:0;padding:5px;overflow-wrap:anywhere}.calendar-grid button[aria-pressed=true]{border:2px solid var(--green);background:#dff1e7}.calendar-grid small{display:block}.calendar-grid .weekday{text-align:center;font-size:.8rem;color:var(--muted)}.calendar-mobile{display:none}.calendar-note{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:620px){.calendar-grid{display:none}.calendar-mobile{display:block}}
.profile-sections{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.profile-sections a{color:var(--green);font-weight:650;padding:7px 10px;border:1px solid var(--line);border-radius:8px}.profile-section{scroll-margin-top:12px}.profile-directory label{min-width:0}.profile-directory input[type=search]{width:min(280px,100%)}.profile-card{overflow-wrap:anywhere}.profile-card details{font-size:.88rem}.profile-card details a{display:block;margin:5px 0}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
<div class="brand"><span class="mark" aria-hidden="true">A</span> AAA Homecare</div>
<label for="branch">Branch workspace<select id="branch"></select></label>
<nav id="nav" class="nav" aria-label="Main navigation"></nav>
<div class="sidefoot"><small id="mode-note">Fictional records · browser only</small><button type="button" class="small" id="reset">Reset sample data</button></div>
</aside>
<main>
<header class="topbar"><span class="env" id="mode-label">● Interactive demo</span><label for="role">Preview as<select id="role"></select></label><form id="logout" method="post" action="/logout" hidden><button type="submit">Sign out</button></form></header>
<div class="content"><p id="notice" class="notice" role="status"></p><div id="view"></div></div>
</main>
</div>
<dialog id="editor" aria-labelledby="editor-title">
<form id="editor-form"><h2 id="editor-title"></h2><div id="editor-fields" class="form-fields"></div><p id="editor-error" class="dialog-error" role="alert"></p><div class="dialog-actions"><button type="button" id="editor-cancel">Cancel</button><button class="primary" id="editor-submit">Save</button></div></form>
</dialog>
<script>
'use strict';
const live = null;

const initialBranches = ['Preston', 'Blackpool', 'Blackburn'];
const pages = { overview:'Overview', rota:'Branch rota', staff:'Staff', clients:'Clients & patches', hr:'HR & onboarding', cover:'Cross-branch cover', mine:'My visits', branches:'Branch setup', accounts:'Hours review', clientCompliance:'Client compliance', carerCompliance:'Carer compliance', access:'Staff access', assessments:'Assessments', diary:'Diary', calendar:'Calendar', archived:'Archived records', actionList:'Branch action list', backups:'Backups & recovery', people:'People', reports:'Weekly branch review' };
const roles = {
  admin:{ label:'Head Office Admin', pages:['overview','rota','staff','clients','hr','cover','accounts','branches'] },
  manager:{ label:'Branch Manager', pages:['overview','rota','staff','clients','cover'] },
  team_leader:{label:'Team Leader',pages:[]},
  hr:{ label:'HR Officer', pages:['hr','staff'] },
  rota:{label:'Rota Coordinator',pages:['overview','rota','staff']},
  accounts:{label:'Accounts',pages:['accounts']},
  carer:{ label:'Carer', pages:['mine'] }
};
const actors = () => [
  {id:'admin',role:'admin'}, {id:'hr-all',role:'hr',label:'Head Office HR'}, {id:'accounts-all',role:'accounts',label:'Head Office Accounts'},
  ...db.branches.flatMap(branch => [
    {id:'manager-'+branch,role:'manager',branch},
    {id:'hr-'+branch,role:'hr',branch},
    {id:'rota-'+branch,role:'rota',branch},
    {id:'accounts-'+branch,role:'accounts',branch}
  ]),
  ...db.staff.map(person => ({id:'carer-'+person.id,role:'carer',branch:person.branch,staff:person.id,label:'Carer · '+person.name}))
];
const key = 'aaa-homecare-preview-v1';
const today = new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const id = () => Array.from(crypto.getRandomValues(new Uint8Array(16)),byte=>byte.toString(16).padStart(2,'0')).join('');
const $ = selector => document.querySelector(selector);
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const h = escapeHtml;

function seed() {
  return {
    branches:[...initialBranches],
    patches:[{id:'p1',name:'Central',branch:'Preston'},{id:'p2',name:'Coastal',branch:'Blackpool'},{id:'p3',name:'North',branch:'Blackburn'}],
    clients:[{id:'c1',name:'Taylor Morgan',patch:'p1',branch:'Preston'},{id:'c2',name:'Charlie Brooks',patch:'p2',branch:'Blackpool'},{id:'c3',name:'Jamie Riley',patch:'p3',branch:'Blackburn'}],
    staff:[
      {id:'s1',name:'Alex Reed',branch:'Preston',training:true,checks:true,cleared:true},
      {id:'s2',name:'Jordan Lane',branch:'Preston',training:true,checks:false,cleared:false},
      {id:'s3',name:'Robin West',branch:'Blackpool',training:true,checks:true,cleared:true},
      {id:'s4',name:'Sam Ellis',branch:'Blackburn',training:true,checks:true,cleared:true}
    ],
    visits:[
      {id:'v1',client:'c1',branch:'Preston',date:today,time:'09:00',minutes:30,required:1,assignments:[{staff:'s1'}],cancelled:false},
      {id:'v2',client:'c1',branch:'Preston',date:today,time:'14:00',minutes:30,required:1,assignments:[],cancelled:false},
      {id:'v3',client:'c2',branch:'Blackpool',date:today,time:'11:00',minutes:45,required:1,assignments:[{staff:'s3',minutes:45,note:'Sample visit completed.'}],cancelled:false},
      {id:'v4',client:'c3',branch:'Blackburn',date:today,time:'17:00',minutes:30,required:2,assignments:[{staff:'s4'}],cancelled:false}
    ],
    requests:[], audit:[]
  };
}
function load() {
  try { return JSON.parse(localStorage.getItem(key)) ?? seed(); } catch { return seed(); }
}
let db = live?.db ?? load();
let actor = live?.actor ?? actors()[0];
let staffAccess = live?.access ?? null;
let scope = actor.branch ?? 'All branches';
const navigation = () => {
  const registerPages = live ? [
    ...(live.catalog.client.length ? ['clientCompliance'] : []),
    ...(live.catalog.carer.length ? ['carerCompliance'] : [])
  ] : [];
  return [...(db.actions?['actionList']:[]),...(db.people?['people']:[]),...(db.reports?['reports']:[]),...registerPages,...(db.assessment?['assessments']:[]),...(db.diary?['diary']:[]),...(db.calendar?['calendar']:[]),...(staffAccess?['access']:[]),...(live?.backupAccess?['backups']:[]),...(live&&actor.role==='admin'?['archived']:[]),...roles[actor.role].pages];
};
let page = navigation()[0];
let saveAction;
let pendingAction;
let saving = false;

const staffById = staff => db.staff.find(person => person.id === staff);
const clientById = client => db.clients.find(person => person.id === client);
const visitById = visit => db.visits.find(item => item.id === visit);
const inScope = branch => canAccess(branch) && (scope === 'All branches' || scope === branch);
const canAccess = branch => !actor.branch || actor.branch === branch;
const canSchedule = branch => ['admin','manager','rota'].includes(actor.role) && canAccess(branch);
const canRequestCover = branch => ['admin','manager'].includes(actor.role) && canAccess(branch);
const canHR = branch => ['admin','hr'].includes(actor.role) && canAccess(branch);
const eligible = person => person?.cleared && !person.archivedAt && (person.eligibilityOnly || (person.training && person.checks));
const actorLabel = person => person.label || [roles[person.role].label,person.branch].filter(Boolean).join(' · ');
const branchOptions = () => db.branches.filter(canAccess).map(branch => [branch,branch]);
const inVisit = (visit,staff) => visit.assignments.some(item => item.staff === staff);
const completed = visit => visit.assignments.filter(item => item.minutes !== undefined).length >= visit.required;
const openVisit = visit => !visit.cancelled && !completed(visit) && visit.assignments.length < visit.required;
const visitStatus = visit => visit.cancelled ? ['Cancelled','bad'] : completed(visit) ? ['Completed','ok'] : openVisit(visit) ? ['Needs cover','warn'] : ['Allocated',''];
const when = visit => visit.date.split('-').reverse().join('/')+' · '+visit.time;
const formatMinutes = minutes => Math.floor(minutes/60)+'h '+minutes%60+'m';

function ensure(condition,message) { if (!condition) throw new Error(message); }
function save(branch,message,area='operations',relatedBranch) {
  db.audit.unshift({branch,relatedBranch,message,area,by:actorLabel(actor),at:new Date().toISOString()});
  localStorage.setItem(key,JSON.stringify(db));
  render();
  notice(message);
}
function notice(message, error=false) {
  $('#notice').textContent = message;
  $('#notice').classList.toggle('error',error);
}
function opts(options) { return options.map(([value,label]) => '<option value="'+h(value)+'">'+h(label)+'</option>').join(''); }
function select(label,name,options) { return '<label>'+h(label)+'<select name="'+name+'" required>'+opts(options)+'</select></label>'; }
function field(label,name,attributes='',value='') { return '<label>'+h(label)+'<input name="'+name+'" '+attributes+' value="'+h(value)+'"></label>'; }
function check(label,name,checked) { return '<label class="check"><input type="checkbox" name="'+name+'" '+(checked?'checked':'')+'>'+h(label)+'</label>'; }
function badge(label,style='') { return '<span class="badge '+style+'">'+h(label)+'</span>'; }
function button(label,action,value='',style='small') {
  return '<button type="button" class="'+style+'" data-action="'+action+'" data-id="'+h(value)+'">'+h(label)+'</button>';
}
function actions(...buttons) { return '<div class="actions">'+buttons.filter(Boolean).join('')+'</div>'; }
function panel(title,description,body,control='') {
  return '<section class="panel"><header class="panel-head"><div><h2>'+h(title)+'</h2>'+(description?'<p class="muted">'+h(description)+'</p>':'')+'</div>'+control+'</header>'+body+'</section>';
}
function table(headers,rows,empty='No records in this workspace.') {
  if (!rows.length) return '<p class="empty">'+h(empty)+'</p>';
  return '<div class="table-wrap" tabindex="0"><table><thead><tr>'+headers.map(col=>'<th scope="col">'+h(col)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(cell=>'<td>'+cell+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function hero(title,description) {
  return '<header class="hero"><div class="eyebrow">'+h(scope)+' workspace</div><h1>'+h(title)+'</h1><p class="sub">'+h(description)+'</p></header>';
}
function metric(title,value,description) {
  return '<div class="card"><p class="muted">'+h(title)+'</p><p class="metric">'+h(value)+'</p><small class="muted">'+h(description)+'</small></div>';
}
function showEditor(title,fields,handler,submit='Save') {
  $('#editor-title').textContent = title;
  $('#editor-fields').innerHTML = fields;
  $('#editor-error').textContent = '';
  $('#editor-submit').textContent = submit;
  saveAction = handler;
  $('#editor').showModal();
}

function overview() {
  const visits = db.visits.filter(visit => inScope(visit.branch));
  const people = db.staff.filter(person => inScope(person.branch));
  const clientMinutes = visits.filter(completed).reduce((sum,visit) => sum+visit.minutes,0);
  const carerMinutes = visits.flatMap(visit => visit.assignments).reduce((sum,item) => sum+(item.minutes??0),0);
  const summary = db.branches.filter(inScope).map(branch => {
    const items = visits.filter(visit => visit.branch===branch);
    return [h(branch),String(people.filter(person => person.branch===branch).length),String(items.length),String(items.filter(openVisit).length),String(items.filter(completed).length)];
  });
  const activity = db.audit.filter(item => (inScope(item.branch) || (item.relatedBranch && inScope(item.relatedBranch))) && (item.area!=='hr'||actor.role==='admin'));
  return hero('Operations overview','Track staffing, visit coverage and completed work across your workspace.') +
    '<div class="cards">'+metric('Visits',visits.length,'Scheduled in this workspace')+metric('Visits needing cover',visits.filter(openVisit).length,'At least one carer needed')+metric('Client visit time',formatMinutes(clientMinutes),'Scheduled time on completed visits')+metric('Recorded carer time',formatMinutes(carerMinutes),'Actual minutes from each carer')+'</div>'+
    panel('Branch performance','Visit totals follow the branch that owns the visit.',table(['Branch','Staff','Visits','Need cover','Completed'],summary))+
    panel('Recent activity','Changes made in this demo workspace.',activity.length?'<ul class="activity">'+activity.slice(0,10).map(item=>'<li>'+h(item.message)+'<time datetime="'+h(item.at)+'">'+h(item.by+' · '+new Date(item.at).toLocaleString('en-GB',{timeZone:'Europe/London'}))+'</time></li>').join('')+'</ul>':'<p class="empty">Actions will appear here after your first change.</p>');
}
function staffPage(hr=false) {
  const rows = db.staff.filter(person => inScope(person.branch)&&!person.archivedAt).map(person => [
    h(person.name),h(person.branch),badge(eligible(person)?'Cleared':'Not cleared',eligible(person)?'ok':'warn'),
    ...(hr?[badge(person.checks?'Complete':'Pending',person.checks?'ok':'warn'),badge(person.training?'Complete':'Pending',person.training?'ok':'warn'),button('Review onboarding','edit-staff',person.id)]:[]),
    ...(db.diary?[button('Open diary','person-diary','carer:'+person.id)]:[]),
    ...(db.people?[button('Open profile','open-person','carer:'+person.id)]:[]),
    ...(live&&actor.role==='admin'?[button('Archive','archive-record','carer:'+person.id)]:[])
  ]);
  return hero(hr?'HR & onboarding':'Branch staff',hr?'Create staff records and review checks and training before clearing carers for allocation.':'See each carer’s home branch and eligibility for allocation.')+
    panel(hr?'Onboarding register':'Staff directory','One staff record per carer, including carers who cover other branches.',
      table(['Name','Home branch','Eligibility',...(hr?['HR checks','Training','Action']:[]),...(db.diary?['Diary']:[]),...(db.people?['Profile']:[]),...(live&&actor.role==='admin'?['Archive']:[])],rows),(hr||actor.role==='manager')?button('Add staff','add-staff','','primary'):'');
}
function clientsPage() {
  return hero('Clients & patches','Organise each branch into patches and give every client a managing branch.')+
    panel('Patches','',table(['Patch','Branch','Clients'],db.patches.filter(patch=>inScope(patch.branch)).map(patch=>[h(patch.name),h(patch.branch),String(db.clients.filter(client=>client.patch===patch.id&&!client.archivedAt).length)])),button('Add patch','add-patch','','primary'))+
    panel('Clients','',table(['Client','Branch','Patch',...(db.diary?['Diary']:[]),...(db.people?['Profile']:[]),...(live&&actor.role==='admin'?['Archive']:[])],db.clients.filter(client=>inScope(client.branch)&&!client.archivedAt).map(client=>[h(client.name),h(client.branch),h(db.patches.find(patch=>patch.id===client.patch)?.name),...(db.diary?[button('Open diary','person-diary','client:'+client.id)]:[]),...(db.people?[button('Open profile','open-person','client:'+client.id)]:[]),...(live&&actor.role==='admin'?[button('Archive','archive-record','client:'+client.id)]:[])])),button('Add client','add-client','','primary'));
}
function rotaPage() {
  const visits = db.visits.filter(visit=>inScope(visit.branch)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  return hero('Branch rota','Allocate cleared carers, organise double-up visits and record cancellations.')+
    panel('Scheduled visits','Each carer on a double-up has their own visit record.',table(['Visit','Branch','When','Carers','Status','Actions'],visits.map(visit=>[
      h(clientById(visit.client)?.name)+'<br><small class="muted">'+h(visit.minutes+' min')+'</small>',h(visit.branch),h(when(visit)),
      h(visit.assignments.length+' / '+visit.required)+'<br><small class="muted">'+h(visit.assignments.map(item=>staffById(item.staff)?.name).join(', '))+'</small>',
      badge(...visitStatus(visit)),

const blankComplianceFilters = () => ({subject:'',patch:'',status:'',page:0});
const complianceFilters = {client:blankComplianceFilters(),carer:blankComplianceFilters()};
const registerPageSize = 15;
const priorityStates = ['overdue','missing','due-soon','check'];
const evidenceLink = entry => entry?.hasPdf ? '<a href="/api/compliance-pdf/'+h(entry.id)+'">Download PDF</a>' : '';
const displayDate = date => date ? date.split('-').reverse().join('/') : '—';
const complianceStates = [
  ['overdue','Overdue','bad'],['missing','Missing','bad'],['due-soon','Due within 30 days','warn'],
  ['check','Check applicability','warn'],['recorded','Recorded','ok'],['not-applicable','Not applicable','']
];
function complianceStatus(definition,entry) {
  if (!entry) return definition.optional?'check':'missing';
  if (entry.status!=='recorded' || !entry.due) return entry.status;
  if (entry.due<today) return 'overdue';
  const days = (Date.parse(entry.due)-Date.parse(today))/86400000;
  return days<=30?'due-soon':'recorded';
}
function complianceEntries(type,subject,key) {
  return (db.compliance??[]).filter(entry=>entry.type===type&&entry.subject===subject&&entry.item===key);
}
function compliancePeople(type) {
  return (type==='client'?db.clients:db.staff).filter(person=>inScope(person.branch)).sort((a,b)=>a.name.localeCompare(b.name));
}
function complianceRegister(type) {
  const filters = complianceFilters[type];
  const people = compliancePeople(type);
  const patches = type==='client'?db.patches.filter(patch=>inScope(patch.branch)):[];
  const applicable = people.filter(person=>!filters.patch||person.patch===filters.patch);
  const patchNames = new Map(patches.map(patch=>[patch.id,patch.name]));
  const latest = new Map();
  for(const entry of db.compliance??[]) {
    if (entry.type!==type) continue;
    const key=entry.subject+':'+entry.item;
    if(!latest.has(key)) latest.set(key,entry);
  }
  const peopleInFilter = applicable.filter(person=>filters.subject?person.id===filters.subject:!person.archivedAt);
  const rows = peopleInFilter.flatMap(person=>live.catalog[type].map(definition=>{
    const entry = latest.get(person.id+':'+definition.key);
    return {person,definition,entry,status:complianceStatus(definition,entry)};
  }).filter(row=>!row.person.archivedAt||row.entry));
  const totals = Object.fromEntries(priorityStates.map(status=>[status,0]));
  const queue = new Map();
  for(const {person,status} of rows) {
    if(person.archivedAt||!priorityStates.includes(status)) continue;
    totals[status]++;
    if(!queue.has(person.id)) queue.set(person.id,{person,counts:Object.fromEntries(priorityStates.map(key=>[key,0]))});
    queue.get(person.id).counts[status]++;
  }
  const priority = [...queue.values()].sort((a,b)=>{
    for(const status of priorityStates) if(a.counts[status]!==b.counts[status]) return b.counts[status]-a.counts[status];
    return a.person.name.localeCompare(b.person.name);
  });
  const matching = rows.filter(row=>!filters.status||row.status===filters.status).sort((a,b)=>{
    const rank = complianceStates.findIndex(item=>item[0]===a.status)-complianceStates.findIndex(item=>item[0]===b.status);
    return rank || (a.entry?.due??'9999').localeCompare(b.entry?.due??'9999') || a.person.name.localeCompare(b.person.name);
  });
  const maxPage = Math.max(0,Math.ceil(matching.length/registerPageSize)-1);
  filters.page = Math.max(0,Math.min(maxPage,filters.page));
  const offset = filters.page*registerPageSize;
  return {people,patches,patchNames,totals,priority,matching,maxPage,offset};
}
function compliancePage(type) {

  const choices = (options,value)=>options.map(([key,label])=>'<option value="'+h(key)+'"'+(key===value?' selected':'')+'>'+h(label)+'</option>').join('');
  const filter = '<form class="register-filters" id="compliance-filter" data-type="'+type+'">'+
    (type==='client'?'<label>Patch<select name="patch">'+choices([['','All patches'],...patches.map(patch=>[patch.id,patch.name+' · '+patch.branch])],filters.patch)+'</select></label>':'')+
    '<label>Person<select name="subject">'+choices([['','Everyone'],...people.filter(person=>!filters.patch||person.patch===filters.patch).map(person=>[person.id,person.name+' · '+person.branch+(person.archivedAt?' · Archived':'')])],filters.subject)+'</select></label>'+
    '<label>Status<select name="status">'+choices([['','All statuses'],...complianceStates.map(([key,label])=>[key,label])],filters.status)+'</select></label>'+
    '<button type="submit">Apply filters</button>'+
    ((filters.subject||filters.patch||filters.status)?button('Clear filters','clear-compliance',type):'')+'</form>';
  const location = person => [person.branch,patchNames.get(person.patch)].filter(Boolean).join(' · ');
  const priorityTable = table(['Person','Overdue','Missing','Due soon','Check applicability','Action'],priority.slice(0,5).map(({person,counts})=>[
    h(person.name)+'<br><small class="muted">'+h(location(person))+'</small>', ...priorityStates.map(status=>String(counts[status])),
    button('Open checklist','open-compliance',type+':'+person.id)
  ]),'No outstanding items in this selection.');
  const pagination = matching.length?'<div class="register-pages"><span role="status">Showing '+(offset+1)+'–'+Math.min(offset+registerPageSize,matching.length)+' of '+matching.length+' items</span>'+
    actions(filters.page>0&&button('Previous','compliance-page',type+':'+(filters.page-1)),
      filters.page<maxPage&&button('Next','compliance-page',type+':'+(filters.page+1)))+'</div>':'';
  return hero(type==='client'?'Client compliance':'Carer compliance',
    type==='client'?'Track care documents, reviews and medication evidence for each client.':'Track recruitment checks, training, competencies, supervision and observed practice.')+
    '<div class="cards">'+priorityStates.map(key=>metric(complianceStates.find(item=>item[0]===key)[1],totals[key],'Items in selected people')).join('')+'</div>'+
    panel('People to review','Up to five people, prioritised by overdue and missing items.',priorityTable)+
    '<div id="evidence-register" tabindex="-1">'+panel('Evidence register','Use the filters to work through a patch, person or status.',filter+table(
      ['Person','Checklist item','Status','Last reviewed','Next review','Evidence','Actions'],
      matching.slice(offset,offset+registerPageSize).map(({person,definition,entry,status})=>{
        const [,label,style] = complianceStates.find(item=>item[0]===status);
        const key = [type,person.id,definition.key].join(':');
        const evidence = entry ? [entry.reference?h(entry.reference):'',evidenceLink(entry)].filter(Boolean).join('<br>') : '';
        return [h(person.name)+'<br><small class="muted">'+h(location(person))+'</small>',h(definition.label),
          badge(label,style),h(displayDate(entry?.reviewed)),h(displayDate(entry?.due)),evidence||'—',
          actions(!person.archivedAt&&button('Update','save-compliance',key),entry&&button('History','compliance-history',key))];
      }),'No matching checklist items. Add a client or staff record first, or change your filters.')+pagination)+'</div>';
}

function complianceContext(key) {

function encodePdf(file) {
  ensure(file.size<=5*1024*1024,'Choose a PDF of up to 5 MB.');
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(String(reader.result).split(',')[1]);
    reader.onerror = ()=>reject(new Error('Could not read this document.'));
    reader.readAsDataURL(file);
  });
}

function overlaps(first,second) {
  const start=visit=>Date.parse(visit.date+'T'+visit.time+'Z');
  return start(first)<start(second)+second.minutes*60000 && start(second)<start(first)+first.minutes*60000;
}
function available(person,visit) {
  return eligible(person)&&!inVisit(visit,person.id)&&!db.visits.some(other=>other.id!==visit.id&&!other.cancelled&&inVisit(other,person.id)&&overlaps(visit,other));
}
function allocateEditor(visit,cover) {
  const permitted = cover ? canRequestCover : canSchedule;
  ensure(visit&&permitted(visit.branch)&&openVisit(visit),'This visit has no open allocation.');
  const directory=cover && db.coverCandidates ? db.coverCandidates : db.staff;
  const people=directory.filter(person=>available(person,visit)&&(cover?person.branch!==visit.branch:person.branch===visit.branch));
  ensure(people.length,cover?'No cleared carers in another branch are available.':'No cleared carers in this branch are available.');
  showEditor(cover?'Request cross-branch cover':'Allocate carer',
    select('Carer','staff',people.map(person=>[person.id,person.name+' · '+person.branch])),
    data=>{
      const person=people.find(item=>item.id===data.get('staff'));
      ensure(permitted(visit.branch)&&openVisit(visit)&&person&&available(person,visit),'This allocation is no longer available.');
      if(cover) {
        ensure(!db.requests.some(item=>item.visit===visit.id&&item.staff===person.id&&item.status==='Pending'),'A pending request already exists for this carer.');
        db.requests.push({id:id(),visit:visit.id,staff:person.id,from:person.branch,to:visit.branch,status:'Pending'});
        save(visit.branch,'Cover requested from '+person.branch+' for '+person.name+'.','operations',person.branch);
      } else {
        addAssignment(visit,person);
        save(visit.branch,person.name+' allocated to the visit.');
      }
    },cover?'Send request':'Allocate');
}
function closeRequests(visit,status) {
  db.requests.filter(item=>item.visit===visit.id&&item.status==='Pending').forEach(item=>{item.status=status;});
}
function addAssignment(visit,person) {
  visit.assignments.push({staff:person.id});
  if(!openVisit(visit)) closeRequests(visit,'Closed · filled');
}
function decideCover(request,action) {
  ensure(request?.status==='Pending','This request has already been resolved.');
  const visit=visitById(request.visit), person=staffById(request.staff);
  const homeManager=actor.role==='manager'&&actor.branch===request.from;
  const admin=actor.role==='admin';
  if(action==='withdraw') {
    ensure(canRequestCover(request.to),'Only the receiving branch can withdraw this request.');
    request.status='Withdrawn';
  } else if(action==='decline') {
    ensure(homeManager||admin,'The home branch manager or Head Office Admin must decline the request.');
    request.status='Declined';
  } else {
    ensure(action==='urgent'?admin:homeManager,'This role cannot approve the request.');
    ensure(visit&&openVisit(visit)&&person&&available(person,visit),'The carer or visit is no longer available.');
    request.status=action==='urgent'?'Approved · urgent':'Approved';
    addAssignment(visit,person);
  }
  save(request.to,'Cover request for '+person.name+': '+request.status+'.','operations',request.from);
}
function cancelEditor(visit) {
  ensure(visit&&canSchedule(visit.branch)&&!visit.cancelled&&!visit.assignments.some(item=>item.minutes!==undefined),'A visit with recorded time cannot be cancelled.');
  showEditor('Cancel visit',field('Cancellation reason','reason','required maxlength="120"'),data=>{
    const reason=data.get('reason').trim();
    ensure(reason,'Enter a cancellation reason.');
    visit.cancelled=true;
    visit.cancelReason=reason;
    closeRequests(visit,'Closed · cancelled');
    save(visit.branch,'Visit cancelled for '+clientById(visit.client).name+'. Reason: '+reason);
  },'Cancel visit');
}
function visitRecord(visit) {
  ensure(visit&&canSchedule(visit.branch),'This visit record is outside your branch.');
  showEditor('Visit record',table(['Carer','Actual time','Note'],visit.assignments.filter(item=>item.minutes!==undefined).map(item=>[
    h(staffById(item.staff)?.name),h(item.minutes+' min'),'<div class="notes">'+h(item.note)+'</div>'
  ])),()=>{},'Done');
}
function recordEditor(visit) {
  const assignment=visit?.assignments.find(item=>item.staff===actor.staff);
  ensure(actor.role==='carer'&&visit&&!visit.cancelled&&assignment&&assignment.minutes===undefined,'This visit is unavailable to record.');
  showEditor('Record visit',field('Actual minutes','minutes','required type="number" min="1" max="720"',visit.minutes)+
    '<label>Visit note<textarea name="note" required maxlength="500" placeholder="Describe the visit"></textarea></label>',data=>{
      const minutes=Number(data.get('minutes')), note=data.get('note').trim();
      ensure(Number.isInteger(minutes)&&minutes>=1&&minutes<=720&&note,'Enter actual minutes and a visit note.');
      assignment.minutes=minutes;
      assignment.note=note;
      save(visit.branch,'Visit recorded by '+staffById(actor.staff).name+'.');
    },'Record visit');
}

$('#role').addEventListener('change',event=>{
  actor=actors().find(person=>person.id===event.target.value);
  scope=actor.branch??'All branches';
  page=roles[actor.role].pages[0];
  notice('');
  render();
});
$('#branch').addEventListener('change',event=>{scope=event.target.value;personResult=null;personKey='';personLoading=false;personError='';++personRequest;assessmentScreen=null;complianceFilters.client=blankComplianceFilters();complianceFilters.carer=blankComplianceFilters();diaryFilters.subject='';diaryFilters.page=0;actionFilters.owner='';actionFilters.page=0;notice('');if(page==='diary') void loadDiary(); else if(page==='calendar') void loadCalendar(); else if(page==='actionList') void loadActionList(); else if(page==='backups') void loadBackups(); else if(page==='reports') void loadWeeklyReport(); else render();});
$('#nav').addEventListener('click',event=>{
  const target=event.target.closest('[data-page]');
  if(target&&navigation().includes(target.dataset.page)) {page=target.dataset.page;assessmentScreen=null;if(page==='people') {personKey='';personResult=null;personLoading=false;personError='';++personRequest;}notice('');if(page==='diary') void loadDiary(); else if(page==='calendar') void loadCalendar(); else if(page==='actionList') void loadActionList(); else if(page==='backups') void loadBackups(); else if(page==='reports') void loadWeeklyReport(); else render();}
});
$('#editor-cancel').addEventListener('click',()=>$('#editor').close());
async function sendAction(action, id, fields = {}) {
  if (saving) return false;
  saving = true;
  $('#editor-submit').disabled = true;
  try {
    const accessAction = ['save-access','revoke-access'].includes(action);
    const diaryAction = action==='add-diary';
    const calendarAction = action==='save-calendar';
    const actionEdit = action==='save-action-item';
    const endpoint = actionEdit?'/api/actions':calendarAction?'/api/calendar':diaryAction?'/api/diary':accessAction?'/api/access':action==='save-compliance'?'/api/compliance':'/api/action';
    const response = await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(diaryAction||calendarAction||actionEdit?fields:{action,id,fields})});
    if (response.status===401) {location.assign(live?.site?'/signin-with-chatgpt?return_to=%2F':'/login');return false;}
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    if (actionEdit) {
      if(page==='actionList') await loadActionList();
    } else if (calendarAction) {
      calendarMonth=fields.start_at.slice(0,7);
      calendarDay='';
      if(page==='people'&&personKey) await openPerson(personKey); else await loadCalendar();
    } else if (diaryAction) {
      diaryFilters={type:fields.type,subject:fields.subject,category:'',page:0};
      await loadDiary();
    } else {
      if (accessAction) staffAccess = result; else db = result;
      render();
    }
    notice('Change saved.');
    return true;
  } finally {
    saving = false;
    $('#editor-submit').disabled = false;
  }
}
$('#editor-form').addEventListener('submit',async event=>{
  event.preventDefault();
  const fields = new FormData(event.target);
  try {
    if (live && !['visit-record','compliance-history','read-diary','read-calendar','read-assessment-source'].includes(pendingAction?.action)) {
      const values = Object.fromEntries(fields);
      if (pendingAction.action==='save-calendar') {
        const [type,id]=String(values.calendar_person??'').split(':');
        values.subject_type=type||null;
        values.subject_id=id||null;
        delete values.calendar_person;
      }
      if (pendingAction.action==='save-compliance') {
        const file = values.pdf;
        delete values.pdf;
        if (file?.size) values.pdf = await encodePdf(file);
      }
      if (!await sendAction(pendingAction.action,pendingAction.id,values)) return;
    } else saveAction(fields);
    $('#editor').close();
  } catch(error) {$('#editor-error').textContent=error.message;}
});
$('#reset').addEventListener('click',()=>{
  showEditor('Reset sample data','<p>This removes the changes saved in this browser.</p>',()=>{
    localStorage.removeItem(key);db=seed();actor=actors()[0];scope='All branches';page='overview';render();notice('Sample data reset.');
  },'Reset');
});
$('#view').addEventListener('click',async event=>{
  const target=event.target.closest('[data-action]');
  if(!target) return;
  const {action,id}=target.dataset;
  pendingAction = {action,id};
  const visit=visitById(id);
  try {
    const handlers={
      'report-open-page':()=>{reportOpenPage=Number(id)||0;render();},
      'open-person':()=>openPerson(id), 'people-directory':backToPeople, 'profile-appointment':()=>calendarEditor(id,personResult?.person),
      'create-backup':createBackupNow,
      'edit-action-item':()=>editExistingAction(id), 'diary-action-item':()=>editDiaryAction(id),
      'action-list-page':()=>moveActionPage(id),
      'archive-record':()=>personArchiveEditor(id,false), 'restore-record':()=>personArchiveEditor(id,true),
      'restore-template':()=>restoreTemplateEditor(id),
      'show-action-list':()=>{page='actionList';void loadActionList();},
      'calendar-month':()=>moveCalendar(id), 'calendar-day':()=>openCalendarDay(id),
      'calendar-event':()=>calendarEditor(id), 'calendar-history':()=>openCalendarHistory(id),
      'person-diary':()=>openPersonDiary(id), 'add-diary':()=>diaryEditor(), 'diary-follow-up':()=>diaryEditor(id), 'read-diary':()=>viewDiaryEntry(id),
      'diary-page':()=>moveDiaryPage(id),
      'assessment-screen':()=>openAssessmentScreen(id), 'assessment-draft':()=>openAssessmentDraft(id),
      'add-question':addAssessmentQuestion, 'remove-question':()=>target.closest('.assessment-question').remove(),
      'archive-template':()=>archiveAssessmentTemplate(id),
      'open-compliance':()=>openCompliance(id), 'compliance-page':()=>changeCompliancePage(id), 'clear-compliance':()=>clearCompliance(id),
      'save-access':()=>accessEditor(id), 'revoke-access':()=>revokeEditor(id),
      'add-staff':()=>staffEditor(), 'edit-staff':()=>staffEditor(staffById(id)),
      'save-compliance':()=>complianceEditor(id), 'compliance-history':()=>complianceHistory(id),
      'add-branch':branchEditor,'add-patch':patchEditor,'add-client':clientEditor,'add-visit':visitEditor,
      allocate:()=>allocateEditor(visit,false),request:()=>allocateEditor(visit,true),
      'cancel-visit':()=>cancelEditor(visit),'visit-record':()=>visitRecord(visit),record:()=>recordEditor(visit)
    };
    if(['approve','urgent','decline','withdraw'].includes(action)) {
      if (live) await sendAction(action,id);
      else decideCover(db.requests.find(item=>item.id===id),action);
    } else await handlers[action]?.();
  } catch(error) {notice(error.message,true);}
});
if (live) {
  $('label[for="role"]').hidden = true;
  $('label[for="role"]').style.display = 'none';
  $('#reset').hidden = true;
  $('#logout').hidden = false;
  $('#mode-label').textContent = actor.label===roles[actor.role].label ? actor.label : actor.label+' · '+roles[actor.role].label;
  $('#mode-note').textContent = 'AAA Homecare workspace';
}
render();
if(live) {
  const params=new URLSearchParams(location.search);
  const source=params.get('source'), person=params.get('person');
  if(person&&db.people) void openPerson(person);
  else if(source) void openActionSource(source).catch(error=>notice(error.message,true));
  else if(page==='actionList') void loadActionList();
}
</script>
</body>
